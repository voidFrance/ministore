<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniStore{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="nav-inner">
            <a href="{{ url_for('dashboard.index') }}" class="logo">MiniStore</a>
            <nav>
                <a href="{{ url_for('dashboard.index') }}"
                   class="{{ 'ativo' if request.path == '/' else '' }}">Dashboard</a>
                <a href="{{ url_for('clientes.listar') }}"
                   class="{{ 'ativo' if request.path.startswith('/clientes') else '' }}">Clientes</a>
                <a href="{{ url_for('categorias.listar') }}"
                   class="{{ 'ativo' if request.path.startswith('/categorias') else '' }}">Categorias</a>
                <a href="{{ url_for('produtos.listar') }}"
                   class="{{ 'ativo' if request.path.startswith('/produtos') else '' }}">Produtos</a>
                <a href="{{ url_for('vendas.listar') }}"
                   class="{{ 'ativo' if request.path.startswith('/vendas') else '' }}">Vendas</a>
            </nav>
        </div>
    </header>

    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>MiniStore &copy; 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
