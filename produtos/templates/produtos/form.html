{% extends 'base.html' %}

{% block title %}{{ 'Editar' if produto and produto.id else 'Novo' }} Produto — MiniStore{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if produto and produto.id else 'Novo' }} Produto</h1>
</div>

{% if produto and produto.id %}
<form action="{{ url_for('produtos.editar', id=produto.id) }}" method="POST">
{% else %}
<form action="{{ url_for('produtos.novo') }}" method="POST">
{% endif %}

    <div class="form-row">
        <div class="form-group">
            <label for="codigo">Código *</label>
            <input type="text" id="codigo" name="codigo" class="form-control" maxlength="50"
                   value="{{ produto.codigo if produto else '' }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="preco">Preço (R$) *</label>
            <input type="text" id="preco" name="preco" class="form-control" inputmode="decimal"
                   placeholder="0,00"
                   value="{{ produto.preco if produto and produto.preco else '' }}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" class="form-control" maxlength="100"
               value="{{ produto.nome if produto else '' }}" required>
    </div>

    <div class="form-group">
        <label for="id_categoria">Categoria</label>
        <select id="id_categoria" name="id_categoria" class="form-control">
            <option value="">sem categoria</option>
            {% for categoria in categorias %}
            <option value="{{ categoria.id }}"
                {{ 'selected' if produto and produto.id_categoria|string == categoria.id|string else '' }}>
                {{ categoria.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-control" rows="3">{{ produto.descricao if produto and produto.descricao else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Salvar' if produto and produto.id else 'Cadastrar' }}</button>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

</form>
{% endblock %}
